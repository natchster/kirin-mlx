[project]
name = "kirin-mlx"
version = "0.1.0"
description = "MLX port of the Kirin animal motion generator (text/image-conditioned diffusion) for Apple silicon"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mlx>=0.29",
    "numpy>=1.26",
]

[project.optional-dependencies]
# `kirin-mlx download` needs no extra packages; `test` runs model/tests without the sandbox.
test = ["pytest>=8"]

[project.scripts]
kirin-mlx = "kirin_mlx.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kirin_mlx"]
